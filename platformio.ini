[platformio]
src_dir = .
default_envs = basic_esp32s3

[env]
platform = espressif32
framework = arduino
extra_scripts = pre:scripts/generate_version.py

monitor_speed = 115200
monitor_filters = send_on_enter, esp32_exception_decoder, colorize
monitor_eol = LF
monitor_echo = yes

upload_speed = 921600

build_flags =
  -Wall
  -Wextra
  -Werror=return-type
  -Iinclude
  -DCORE_DEBUG_LEVEL=0
  -DLOG_LEVEL=2
  ; Production monitoring (uncomment as needed):
  ; -DCONFIG_FREERTOS_USE_TRACE_FACILITY=1
  ; -DCONFIG_FREERTOS_USE_STATS_FORMATTING_FUNCTIONS=1
  ; -DCONFIG_ESP_TASK_WDT_CHECK_IDLE_TASK_CPU0=y

; ESP-PROG / ESP-PROG2
debug_tool = esp-prog
debug_init_break = tbreak setup

; -------------------------
; ESP32-S3 shared config
; -------------------------
[env:esp32s3dev]
extends = env
board = esp32-s3-devkitc-1
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = default.csv
build_flags =
  ${env.build_flags}
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

; -------------------------
; ESP32-S2 shared config
; Note: ESP32-S2 uses hardware UART Serial (GPIO43/44) by default
; USB CDC Serial has framework issues with current version
; -------------------------
[env:esp32s2dev]
extends = env
board = esp32-s2-saola-1
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = default.csv
build_flags =
  ${env.build_flags}

; -------------------------
; SSD1315 Examples
; -------------------------

; 00_basic_text_or_pixels - Full buffer mode demo (S3)
[env:basic_esp32s3]
extends = env:esp32s3dev
build_src_filter =
  -<*>
  +<examples/00_basic_text_or_pixels/**>
  +<src/**>
  +<include/**>

; 00_basic_text_or_pixels - Full buffer mode demo (S2)
[env:basic_esp32s2]
extends = env:esp32s2dev
build_src_filter =
  -<*>
  +<examples/00_basic_text_or_pixels/**>
  +<src/**>
  +<include/**>

; 01_page_buffer_mode - Page buffer iteration demo (S3)
[env:pagebuf_esp32s3]
extends = env:esp32s3dev
build_src_filter =
  -<*>
  +<examples/01_page_buffer_mode/**>
  +<src/**>
  +<include/**>

; 01_page_buffer_mode - Page buffer iteration demo (S2)
[env:pagebuf_esp32s2]
extends = env:esp32s2dev
build_src_filter =
  -<*>
  +<examples/01_page_buffer_mode/**>
  +<src/**>
  +<include/**>

; 02_scroll_and_invert - Hardware scroll and effects demo (S3)
[env:scroll_esp32s3]
extends = env:esp32s3dev
build_src_filter =
  -<*>
  +<examples/02_scroll_and_invert/**>
  +<src/**>
  +<include/**>

; 02_scroll_and_invert - Hardware scroll and effects demo (S2)
[env:scroll_esp32s2]
extends = env:esp32s2dev
build_src_filter =
  -<*>
  +<examples/02_scroll_and_invert/**>
  +<src/**>
  +<include/**>
