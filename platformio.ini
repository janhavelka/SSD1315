[platformio]
src_dir = .
default_envs = esp32s3dev

[dependency_pins]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
previous_platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip

[env]
platform = ${dependency_pins.platform}
framework = arduino
extra_scripts =
  pre:scripts/platformio_toolchain_path.py
  pre:scripts/generate_version.py

monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
monitor_filters = send_on_enter, esp32_exception_decoder, colorize
monitor_eol = LF
monitor_echo = yes

upload_speed = 921600

build_flags =
  -Wall
  -Wextra
  -Werror=return-type
  -Iinclude
  -DCORE_DEBUG_LEVEL=0
  ; Production monitoring (uncomment as needed):
  ; -DCONFIG_FREERTOS_USE_TRACE_FACILITY=1
  ; -DCONFIG_FREERTOS_USE_STATS_FORMATTING_FUNCTIONS=1
  ; -DCONFIG_ESP_TASK_WDT_CHECK_IDLE_TASK_CPU0=y

; ESP-PROG / ESP-PROG2
debug_tool = esp-prog
debug_init_break = tbreak setup

; -------------------------
; ESP32-S3 dev config
; -------------------------
[env:esp32s3dev]
extends = env
board = esp32-s3-devkitc1-n16r8
build_flags =
  ${env.build_flags}
  -DLOG_LEVEL=2
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter =
  -<*>
  +<examples/01_basic_bringup_cli/**>
  +<examples/common/**>
  +<src/**>
  +<include/**>

; Build-only compatibility check for the previously qualified platform.
; Normal example and HIL work use 55.03.311 through [env].
[env:compat_pioarduino_54_s3]
extends = env:esp32s3dev
platform = ${dependency_pins.previous_platform}

; -------------------------
; ESP32-S2 dev config
; -------------------------
[env:esp32s2dev]
extends = env
board = esp32-s2-saola-1
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = default.csv
build_flags =
  ${env.build_flags}
  -DLOG_LEVEL=2
  -DARDUINO_USB_MODE=0
  -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter =
  -<*>
  +<examples/01_basic_bringup_cli/**>
  +<examples/common/**>
  +<src/**>
  +<include/**>

[env:native]
platform = native
framework =
test_framework = unity
test_build_src = true
build_src_filter =
  -<*>
  +<src/**>
  +<include/**>
build_flags =
  -std=c++17
  -Iinclude
  -Iexamples
  -Itest/stubs
extra_scripts = pre:scripts/generate_version.py
