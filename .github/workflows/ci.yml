name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment:
          - esp32s3dev
          - esp32s2dev
          - compat_pioarduino_54_s3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio==6.1.19

      - name: Build ${{ matrix.environment }}
        run: pio run -e ${{ matrix.environment }}

  native-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: ${{ runner.os }}-pio-native-${{ hashFiles('platformio.ini') }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio==6.1.19

      - name: Enforce core timing guard
        run: python tools/check_core_timing_guard.py

      - name: Run native tests
        run: pio test -e native

  validate-library:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install platformio==6.1.19

      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen graphviz default-jre

      - name: Enforce example CLI contract
        run: python tools/check_cli_contract.py

      - name: Enforce ESP-IDF example contract
        run: python tools/check_idf_example_contract.py

      - name: Check generated version header
        run: python scripts/generate_version.py check

      - name: Validate HIL tooling contracts
        run: |
          python -m py_compile tools/run_ssd1315_hil.py tools/check_cli_contract.py tools/check_idf_example_contract.py
          python -B tools/test_hil_runner_parser.py
          python tools/run_ssd1315_hil.py --dry-run
          python tools/run_ssd1315_hil.py --dry-run --mode smoke
          python tools/run_ssd1315_hil.py --dry-run --mode functional
          python tools/run_ssd1315_hil.py --dry-run --mode retention
          python tools/run_ssd1315_hil.py --dry-run --mode benchmark --soak-ops 10
          python tools/run_ssd1315_hil.py --dry-run --mode arduino-extended
          python tools/run_ssd1315_hil.py --dry-run --mode soak --soak-ops 10
          python tools/run_ssd1315_hil.py --dry-run --mode all --soak-ops 10

      - name: Build API documentation
        run: doxygen Doxyfile

      - name: Validate library package
        run: pio pkg pack

      - name: Check package contents
        run: python tools/check_package_contents.py

  esp-idf-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - esp32s3
          - esp32s2
        idf-version:
          - v5.3.5
          - v5.5.5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build ESP-IDF example for ${{ matrix.target }}
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ matrix.idf-version }}
          target: ${{ matrix.target }}
          path: examples/espidf_basic
